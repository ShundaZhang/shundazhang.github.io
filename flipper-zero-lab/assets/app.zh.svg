<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">小型 App 架构</title><desc id="desc">本站原创教学图，标注组件与数据流。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1000" height="320" fill="#f4f8fa"/><g font-family="system-ui, sans-serif"><text x="30" y="40" font-size="23" fill="#183044" text-anchor="start" font-weight="700">小型 App 架构</text><rect x="30.0" y="100" width="205.0" height="135" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="132.5" y="130" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">输入回调</text><text x="132.5" y="215" font-size="16" fill="#526779" text-anchor="middle">事件入队</text><path d="M240.0,167 L270.0,167" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><rect x="275.0" y="100" width="205.0" height="135" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="377.5" y="130" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">主循环</text><text x="377.5" y="215" font-size="16" fill="#526779" text-anchor="middle">消费事件</text><path d="M485.0,167 L515.0,167" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><rect x="520.0" y="100" width="205.0" height="135" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="622.5" y="130" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">状态</text><text x="622.5" y="215" font-size="16" fill="#526779" text-anchor="middle">互斥保护</text><path d="M730.0,167 L760.0,167" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><rect x="765.0" y="100" width="205.0" height="135" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="867.5" y="130" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">绘图回调</text><text x="867.5" y="193" font-size="16" fill="#526779" text-