<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 950" role="img" aria-labelledby="title desc"><title id="title">M1 / Classic: emulation vs physical copy</title><desc id="desc">Original teaching workflow, not a hardware test result.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="680" height="950" fill="#f3f7fa"/><g font-family="system-ui,sans-serif"><text x="340" y="48" text-anchor="middle" font-size="25" fill="#183044" font-weight="700">M1 / Classic: emulation vs physical copy</text><rect x="45" y="85" width="590" height="100" rx="12" fill="white" stroke="#236a80" stroke-width="2"/><text x="340.0" y="124" text-anchor="middle" font-size="25" fill="#236a80" font-weight="700">Read your Classic 1K card</text><text x="340.0" y="159" text-anchor="middle" font-size="21" fill="#183044">NFC → Read · 16 sectors · known keys</text><path d="M340 192 L340 222" fill="none" stroke="#526779" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="230" width="590" height="100" rx="12" fill="white" stroke="#236a80" stroke-width="2"/><text x="340.0" y="269" text-anchor="middle" font-size="25" fill="#236a80" font-weight="700">Save the complete private image</text><text x="340.0" y="304" text-anchor="middle" font-size="21" fill="#183044">More → Save · preserve .nfc baseline</text><path d="M340 337V365H180V391M340 365H500V391" fill="none" stroke="#526779" stroke-width="2.5"/><path d="M180 373 L180 393" fill="none" stroke="#526779" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500 373 L500 393" fill="none" stroke="#526779" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="405" width="300" height="100" rx="12" fill="white" stroke="#236a80" stroke-width="2"/><text x="180.0" y="444" text-anchor="middle" font-size="25" fill="#236a80" font-weight="700">Flipper emulation</text><text x="180.0" y="479" text-anchor="middle" font-size="21" fill="#183044">Saved → Emulate</text><rect x="350" y="405" width="300" height="100" rx="12" fill="white" stroke="#236a80" stroke-width="2"/><text x="500.0" y="444" text-anchor="middle" font-size="25" fill="#236a80" font-weight="700">Magic blank</text><text x="500.0" y="479" text-anchor="middle" font-size="21" fill="#183044">Check Magic Tag</text><path d="M180 512 L180 542" fill="none" stroke="#526779" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500 512 L500 542" fill="none" stroke="#526779" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="30" y="550" width="300" height="100" rx="12" fill="white" stroke="#236a80" stroke-width="2"/><text x="180.0" y="589" text-anchor="middle" font-size="25" fill="#236a80" font-weight="700">Hold at lab reader</text><text x="180.0" y="624" text-anchor="middle" font-size="21" fill="#183044">Inspect .shd changes</text><rect x="350" y="550" width="300" height="100" rx="12" fill="white" stroke="#236a80" stroke-width="2"/><text x="500.0" y="589" text-anchor="middle" font-size="25" fill="#236a80" font-weight="700">More → Write</text><text x="500.0" y="624" text-anchor="middle" font-size="21" fill="#183044">Image → blank → reread</text><path d="M180 657V685H500V657" fill="none" stroke="#526779" stroke-width="2.5"/><path d="M340 685 L340 715" fill="none" stroke="#526779" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="725" width="590" height="100" rx="12" fill="white" stroke="#c74c0b" stroke-width="2"/><text x="340.0" y="764" text-anchor="middle" font-size="25" fill="#c74c0b" font-weight="700">Verify on the authorized reader</text><text x="340.0" y="799" text-anchor="middle" font-size="21" fill="#183044">UID + authentication + application data</text><text x="340" y="875" text-anchor="middle" font-size="23" fill="#c74c0b" font-weight="700">UID only ≠ complete copy</text><text x="340" y="915" text-anchor="middle" font-size="21" fill="#183044">Write to Initial Card ≠ write a new blank</text></g></svg>