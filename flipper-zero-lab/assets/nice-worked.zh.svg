<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 900" role="img" aria-labelledby="title desc"><title id="title">Nice FLOR-S：捕获 → 编码 → 验证</title><desc id="desc">原创教学流程图，不是硬件实测结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="680" height="900" fill="#f3f7fa"/><g font-family="system-ui,sans-serif"><text x="340" y="48" text-anchor="middle" font-size="25" fill="#183044" font-weight="700">Nice FLOR-S：捕获 → 编码 → 验证</text><rect x="45" y="85" width="590" height="100" rx="12" fill="white" stroke="#236a80" stroke-width="2"/><text x="340.0" y="124" text-anchor="middle" font-size="25" fill="#236a80" font-weight="700">备份 → 安装 Unleashed</text><text x="340.0" y="159" text-anchor="middle" font-size="21" fill="#183044">Release + 匹配的 SD 资源</text><path d="M340 192 L340 222" fill="none" stroke="#526779" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="230" width="590" height="100" rx="12" fill="white" stroke="#236a80" stroke-width="2"/><text x="340.0" y="269" text-anchor="middle" font-size="25" fill="#236a80" font-weight="700">Sub-GHz → Read → Save</text><text x="340.0" y="304" text-anchor="middle" font-size="21" fill="#183044">433.92 MHz · 匹配 AM/OOK</text><path d="M340 337 L340 367" fill="none" stroke="#526779" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="375" width="590" height="100" rx="12" fill="white" stroke="#236a80" stroke-width="2"/><text x="340.0" y="414" text-anchor="middle" font-size="25" fill="#236a80" font-weight="700">私有解码捕获</text><text x="340.0" y="449" text-anchor="middle" font-size="21" fill="#183044">Serial · Button · Counter</text><path d="M340 482 L340 512" fill="none" stroke="#526779" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="520" width="590" height="100" rx="12" fill="white" stroke="#c74c0b" stroke-width="2"/><text x="340.0" y="559" text-anchor="middle" font-size="25" fill="#c74c0b" font-weight="700">Saved → Emulate → Send</text><text x="340.0" y="594" text-anchor="middle" font-size="21" fill="#183044">编码器 + 计数器状态策略</text><path d="M340 627 L340 657" fill="none" stroke="#526779" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="45" y="665" width="590" height="100" rx="12" fill="white" stroke="#236a80" stroke-width="2"/><text x="340.0" y="704" text-anchor="middle" font-size="25" fill="#236a80" font-weight="700">自有接收器：接受还是拒绝？</text><text x="340.0" y="739" text-anchor="middle" font-size="21" fill="#183044">身份 + 新鲜度 + 注册状态</text><text x="340" y="823" text-anchor="middle" font-size="22" fill="#c74c0b" font-weight="700">RAW 重放 ≠ 生成新的滚动码帧</text><text x="340" y="864" text-anchor="middle" font-size="22" fill="#183044">失败？停止发射，检查接收端同步</text></g></svg>