<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 415" role="img" aria-labelledby="title desc"><title id="title">先进行只接收 UART 实验</title><desc id="desc">本站原创教学图，标注组件与数据流。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1000" height="415" fill="#f4f8fa"/><g font-family="system-ui, sans-serif"><text x="30" y="40" font-size="23" fill="#183044" text-anchor="start" font-weight="700">先进行只接收 UART 实验</text><rect x="45" y="100" width="300" height="200" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="195.0" y="130" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">Flipper Zero</text><text x="195.0" y="280" font-size="16" fill="#526779" text-anchor="middle">选定的 UART</text><rect x="655" y="100" width="300" height="200" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="805.0" y="130" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">3.3 V 测试板</text><text x="805.0" y="280" font-size="16" fill="#526779" text-anchor="middle">独立供电</text><path d="M655,175 L345,175" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><text x="500.0" y="163.0" font-size="17" fill="#526779" text-anchor="middle">板 TX → Flipper RX</text><path d="M345,260 L655,260" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><text x="500.0" y="248.0" font-size="17" fill="#526779" text-anchor="middle">GND ↔ GND</text><text x="500" y="335" font-size="21" fill="#d65716" text-anchor="middle" font-weight="700">开始时不接 VCC 和 Flipper TX</text><text x="500" y="378" font-size="19" fill="#526779" text-anchor="middle">接线前确认引脚编号与逻辑电平</text></g></svg>