<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">Identity and freshness are different checks</title><desc id="desc">Original educational diagram. Labels describe components and data flow.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1000" height="490" fill="#f4f8fa"/><g font-family="system-ui, sans-serif"><text x="30" y="40" font-size="23" fill="#183044" text-anchor="start" font-weight="700">Identity and freshness are different checks</text><text x="35" y="90" font-size="20" fill="#d65716" text-anchor="start" font-weight="700">Fixed-code conceptual model</text><rect x="35" y="115" width="260" height="95" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="165.0" y="145" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">ID + button</text><text x="165.0" y="190" font-size="16" fill="#526779" text-anchor="middle">Same command</text><path d="M305,160 L380,160" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="115" width="260" height="95" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="520.0" y="145" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">ID + button</text><text x="520.0" y="190" font-size="16" fill="#526779" text-anchor="middle">Same command</text><path d="M660,160 L710,160" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><rect x="720" y="115" width="245" height="95" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="842.5" y="145" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">Compare value</text><text x="842.5" y="190" font-size="16" fill="#526779" text-anchor="middle">No freshness check</text><text x="35" y="270" font-size="20" fill="#196854" text-anchor="start" font-weight="700">Rolling-code conceptual model</text><rect x="35" y="295" width="260" height="115" rx="12" fill="#fff" stroke="#196854" stroke-width="2"/><text x="165.0" y="325" font-size="19" fill="#196854" text-anchor="middle" font-weight="700">ID + n + code(n)</text><text x="165.0" y="390" font-size="16" fill="#526779" text-anchor="middle">Transmitter state</text><path d="M305,350 L380,350" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="295" width="260" height="115" rx="12" fill="#fff" stroke="#196854" stroke-width="2"/><text x="520.0" y="325" font-size="19" fill="#196854" text-anchor="middle" font-weight="700">Verify + window</text><text x="520.0" y="390" font-size="16" fill="#526779" text-anchor="middle">Receiver state n₀</text><path d="M660,350 L710,350" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><rect x="720" y="295" width="245" height="115" rx="12" fill="#fff" stroke="#196854" stroke-width="2"/><text x="842.5" y="325" font-size="19" fill="#196854" text-anchor="middle" font-weight="700">Accept → update</text><text x="842.5" y="390" font-size="16" fill="#526779" text-anchor="middle">Old code → reject</text><text x="35" y="455" font-size="18" fill="#526779" text-anchor="start">This diagram does not specify the Nice FLOR-S packet format</text></g></svg>