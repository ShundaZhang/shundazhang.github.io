<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc"><title id="title">身份与新鲜度是不同的检查</title><desc id="desc">本站原创教学图，标注组件与数据流。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1000" height="490" fill="#f4f8fa"/><g font-family="system-ui, sans-serif"><text x="30" y="40" font-size="23" fill="#183044" text-anchor="start" font-weight="700">身份与新鲜度是不同的检查</text><text x="35" y="90" font-size="20" fill="#d65716" text-anchor="start" font-weight="700">固定码概念模型</text><rect x="35" y="115" width="260" height="95" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="165.0" y="145" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">ID + button</text><text x="165.0" y="190" font-size="16" fill="#526779" text-anchor="middle">相同指令</text><path d="M305,160 L380,160" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="115" width="260" height="95" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="520.0" y="145" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">ID + button</text><text x="520.0" y="190" font-size="16" fill="#526779" text-anchor="middle">相同指令</text><path d="M660,160 L710,160" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><rect x="720" y="115" width="245" height="95" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="842.5" y="145" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">比较码值</text><text x="842.5" y="190" font-size="16" fill="#526779" text-anchor="middle">没有新鲜度检查</text><text x="35" y="270" font-size="20" fill="#196854" text-anchor="start" font-weight="700">滚动码概念模型</text><rect x="35" y="295" width="260" height="115" rx="12" fill="#fff" stroke="#196854" stroke-width="2"/><text x="165.0" y="325" font-size="19" fill="#196854" text-anchor="middle" font-weight="700">ID + n +</text><text x="165.0" y="350" font-size="19" fill="#196854" text-anchor="middle" font-weight="700">code(n)</text><text x="165.0" y="390" font-size="16" fill="#526779" text-anchor="middle">发射端状态</text><path d="M305,350 L380,350" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><rect x="390" y="295" width="260" height="115" rx="12" fill="#fff" stroke="#196854" stroke-width="2"/><text x="520.0" y="325" font-size="19" fill="#196854" text-anchor="middle" font-weight="700">验证 + 接受窗口</text><text x="520.0" y="390" font-size="16" fill="#526779" text-anchor="middle">接收端状态 n₀</text><path d="M660,350 L710,350" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><rect x="720" y="295" width="245" height="115" rx="12" fill="#fff" stroke="#196854" stroke-width="2"/><text x="842.5" y="325" font-size="19" fill="#196854" text-anchor="middle" font-weight="700">接受后更新</text><text x="842.5" y="390" font-size="16" fill="#526779" text-anchor="middle">旧码 → 拒绝</text><text x="35" y="455" font-size="18" fill="#526779" text-anchor="start">本图不定义 Nice FLOR-S 的报文格式</text></g></svg>