<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">An identifier is one input to a security decision</title><desc id="desc">Original educational diagram. Labels describe components and data flow.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1000" height="450" fill="#f4f8fa"/><g font-family="system-ui, sans-serif"><text x="30" y="40" font-size="23" fill="#183044" text-anchor="start" font-weight="700">An identifier is one input to a security decision</text><text x="35" y="95" font-size="21" fill="#d65716" text-anchor="start" font-weight="700">Identifier lookup</text><rect x="35" y="120" width="270" height="90" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="170.0" y="150" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">ID</text><text x="170.0" y="190" font-size="16" fill="#526779" text-anchor="middle">Static identifier</text><path d="M315,165 L410,165" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><rect x="425" y="120" width="530" height="90" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="690.0" y="150" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">Reader checks allowlist</text><text x="690.0" y="190" font-size="16" fill="#526779" text-anchor="middle">Same ID may produce the same decision</text><text x="35" y="275" font-size="21" fill="#196854" text-anchor="start" font-weight="700">Authenticated exchange</text><rect x="35" y="300" width="270" height="105" rx="12" fill="#fff" stroke="#196854" stroke-width="2"/><text x="170.0" y="330" font-size="19" fill="#196854" text-anchor="middle" font-weight="700">Challenge</text><text x="170.0" y="385" font-size="16" fill="#526779" text-anchor="middle">Fresh random value</text><path d="M315,350 L365,350" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><rect x="380" y="300" width="270" height="105" rx="12" fill="#fff" stroke="#196854" stroke-width="2"/><text x="515.0" y="330" font-size="19" fill="#196854" text-anchor="middle" font-weight="700">Response</text><text x="515.0" y="385" font-size="16" fill="#526779" text-anchor="middle">Uses a secret key</text><path d="M660,350 L705,350" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><rect x="720" y="300" width="235" height="105" rx="12" fill="#fff" stroke="#196854" stroke-width="2"/><text x="837.5" y="330" font-size="19" fill="#196854" text-anchor="middle" font-weight="700">Verify</text><text x="837.5" y="385" font-size="16" fill="#526779" text-anchor="middle">Policy + freshness</text></g></svg>