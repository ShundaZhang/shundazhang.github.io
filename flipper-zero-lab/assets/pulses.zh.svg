<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 335" role="img" aria-labelledby="title desc"><title id="title">合成脉冲时序</title><desc id="desc">本站原创教学图，标注组件与数据流。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526779"/></marker></defs><rect width="1000" height="335" fill="#f4f8fa"/><g font-family="system-ui, sans-serif"><text x="30" y="40" font-size="23" fill="#183044" text-anchor="start" font-weight="700">合成脉冲时序</text><text x="35" y="90" font-size="19" fill="#183044" text-anchor="start">解调后的包络</text><polyline points="40,185 40,125 70,125 70,185 160,185 160,125 250,125 250,185 280,185 280,125 310,125 310,185 400,185 400,125 490,125 490,185 520,185" fill="none" stroke="#d65716" stroke-width="4"/><path d="M40,205 L890,205" fill="none" stroke="#526779" stroke-width="2" marker-end="url(#a)"/><text x="465.0" y="193.0" font-size="17" fill="#526779" text-anchor="middle">时间 / µs</text><text x="40" y="250" font-size="20" fill="#183044" text-anchor="start">+300  −900      +900  −300      +300  −900      +900  −300</text><text x="40" y="295" font-size="20" fill="#183044" text-anchor="start">高 / 低电平时长 → 比较比例 → 观察重复帧</text><rect x="665" y="90" width="280" height="95" rx="12" fill="#fff" stroke="#236a80" stroke-width="2"/><text x="805.0" y="120" font-size="19" fill="#236a80" text-anchor="middle" font-weight="700">RAW ≠ I/Q</text><text x="805.0" y="165" font-size="16" fill="#526779" text-anchor="middle">不保留载波相位采样</text></g></svg>